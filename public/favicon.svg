  <rect x="29" y="19" width="3.5" height="16" rx="1.75" fill="#2563EB" />
  <rect x="35" y="21" width="3.5" height="12" rx="1.75" fill="#0284C7" />
  <rect x="41" y="24" width="3.5" height="6" rx="1.75" fill="#0EA5E9" />

