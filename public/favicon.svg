<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Matte dark finish gradient: deep graphite to dark carbon with subtle matte indigo tone -->
    <linearGradient id="matteDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e2b" />
      <stop offset="60%" stop-color="#0f1420" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Subtle matte dark inner border/bevel highlight -->
    <linearGradient id="matteBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Matte voice waveform gradient -->
    <linearGradient id="matteWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <filter id="subtleMatteShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle icon badge: Matte & Dark finish -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#matteDarkBg)" stroke="url(#matteBorder)" stroke-width="1.5" filter="url(#subtleMatteShadow)" />

  <!-- Subtle inner matte glow ring -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#2a364f" stroke-width="0.75" stroke-opacity="0.6" />

  <!-- Matte dark speech bubble with subtle outline -->
  <path d="M16 18 C16 14.686 18.686 12 22 12 L42 12 C45.314 12 48 14.686 48 18 L48 34 C48 37.314 45.314 40 42 40 L28 40 L19 47 L20.5 40 L22 40 C18.686 40 16 37.314 16 34 Z" fill="#1e2638" stroke="#37435f" stroke-width="1.25" />

  <!-- Audio speech sound waves inside bubble (vocal learning indicator in matte tones) -->
  <rect x="23" y="23" width="3.5" height="8" rx="1.75" fill="#6366f1" />
  <rect x="29" y="18" width="3.5" height="17" rx="1.75" fill="url(#matteWaveGrad)" />
  <rect x="35" y="20.5" width="3.5" height="13" rx="1.75" fill="#38bdf8" />
  <rect x="41" y="24" width="3.5" height="6" rx="1.75" fill="#64748b" />

  <!-- Intelligent AI spark / dot in soft matte cyan -->
  <circle cx="48" cy="14" r="3.2" fill="#38bdf8" stroke="#0f172a" stroke-width="1.2" />
</svg>
